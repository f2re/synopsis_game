    status: "pass_aaa"
  ink_on_paper_highlight:
    foreground: "#1E2430"
    background: "#F3ECD8"
    ratio: "12.8:1"
    status: "pass_aaa"
  text_on_action_button:
    foreground: "#1E2430"
    background: "#F2C75C"
    ratio: "9.2:1"
    status: "pass_aaa"
  text_snow_on_teal_panel:
    foreground: "#F4F7FA"
    background: "#0C2A33"
    ratio: "14.7:1"
    status: "pass_aaa"
  teal_highlight_on_teal_panel:
    foreground: "#6F9E95"
    background: "#0C2A33"
    ratio: "5.1:1"
