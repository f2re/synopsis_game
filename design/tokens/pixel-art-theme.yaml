version: 2
status: accepted-art-direction
notes:
  - "Мастер-палитра v2: 56 семантических цветов (<= 64 цвета)."
  - "Горизонт Северо-Запада: Финский залив, гранит, сосны, берёзы, кирпичные фасады; горы категорически отсутствуют."
  - "Метеорологические цвета строго изолированы в слое карты и не используются в декоративном арте."
  - "Контраст всех ключевых интерфейсных пар >= 4,5:1 (WCAG AA)."

grid:
  logical_resolution: "480x270"
  integer_scaling_multipliers: [2, 3, 4]
  passepartout_tile: "16x16 teal cloth pattern"
  pixel_perfect: true

scale_families:
  m1_yard:
    name: "M1 Двор (Хаб)"
    human_size: "10x22"
    bird_size: "6x5"
    cat_size: "10x7"
    building_width: "60-120"
  m2_room:
    name: "M2 Комната (Пост / Интерьер)"
    human_size: "32x48"
    bird_size: "14x12"
    cat_size: "24x16"
    desk_props: "M2 scale"
  m3_portrait:
    name: "M3 Портрет (Диалоги / Наставник)"
    head_shoulders: "64x64"
    cat_size: "48x32"

