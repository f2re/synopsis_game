version: 2
status: accepted-art-direction
notes:
  - UI colors are separate from meteorological semantic colors.
  - Runtime may interpolate world lighting between phase tokens.
  - Accessibility variants may adjust luminance/contrast but not meteorological meaning.
  - Hub baseline uses a 480x270 logical pixel grid and chunky readable color clusters.

ui:
  panel: "#143F4C"
  panel_elevated: "#1B5660"
  panel_border: "#6F9E95"
  text_primary: "#F7F3E8"
  text_secondary: "#C9D9D2"
  primary_cta: "#F2C75C"
  primary_cta_highlight: "#FFDD83"
  success: "#5FAF78"
  warning: "#D89A52"
  error: "#D65E5E"
  focus: "#F0D476"
  locked_panel: "#34465C"
  disabled_panel: "#3C4857"
  locked_text: "#C1CAD1"

typography:
  display_font: "PressStart2P"
  ui_font: "PixCyrillic"
  dense_font: "PixCyrillic-Dense"
  mono_font: "PressStart2P"
  fallback_font: "monospace"
  rendering:
    font_smooth: "never"
    webkit_font_smoothing: "none"
    text_rendering: "pixelated"
  scales:
    display:
      hero: "32px"
      h1: "24px"
      h2: "16px"
      kicker: "8px"
      badge: "8px"
    ui:
      title: "20px"
      button: "16px"
      body: "16px"
      subtext: "12px"
      caption: "8px"
    line_height:
      tight: 1.15
      normal: 1.3
      relaxed: 1.5
  cyrillic_requirements:
    full_alphabet: true
    yo_support: true
    numbers_and_punctuation: true
    meteo_symbols: true
    no_blurry_antialiasing: true

meteo:
  cold_front: "#2878D8"
  warm_front: "#E44747"
  occlusion: "#8A54C5"
  stationary_cold: "#2878D8"
  stationary_warm: "#E44747"
  pressure_high: "#2F67B7"
  pressure_low: "#D94848"
  tendency_rise: "#2B70C9"
  tendency_fall: "#D94848"
  relative_topography_cold: "#347FD0"
  relative_topography_warm: "#D95745"
  note: "These values are semantic defaults; a method profile may define print/training variants. Cosmetics must not redefine them."

world_base:
  sky_day: "#8EC9E5"
  cloud_warm: "#F6F0E6"
  mountain_far: "#9EB1CF"
  mountain_mid: "#7F9ABC"
  concrete: "#D7CDB5"
  stone_mid: "#B7AA90"
  dark_stone: "#4E5D62"
  wood: "#8B6446"
  wood_dark: "#5E4634"
  vegetation_dark: "#365F4A"
  vegetation_mid: "#5F8D5E"
  vegetation_light: "#86AA6E"
  blossom_pink: "#E7A4B5"
  blossom_yellow: "#F1D06F"
  warm_window: "#F4C56A"
  tungsten: "#E9B35E"
  water_dark: "#4E8BA3"
  water_mid: "#6FB5C6"
  water_light: "#A8D9DC"

location_states:
  available:
    saturation_multiplier: 1.0
    entrance_light_strength: 1.0
    border: "#F2C75C"
  active:
    saturation_multiplier: 1.0
    entrance_light_strength: 1.0
    border: "#FFDD83"
  locked:
    saturation_multiplier: 0.68
    entrance_light_strength: 0.15
    border: "#AEB8C4"
  disabled:
    saturation_multiplier: 0.55
    entrance_light_strength: 0.0
    border: "#78818B"

phases:
  dawn:
    sky_top: "#6F99C8"
    sky_horizon: "#E9A693"
    ambient_tint: "#C6A3AA"
    shadow: "#59697C"
    window_light_strength: 0.45
    lamp_strength: 0.20
    stars_strength: 0.05
  day:
    sky_top: "#8EC9E5"
    sky_horizon: "#D8ECF0"
    ambient_tint: "#E7EEE8"
    shadow: "#6F817E"
    window_light_strength: 0.12
    lamp_strength: 0.00
    stars_strength: 0.00
  golden_hour:
    sky_top: "#789AC8"
    sky_horizon: "#F0B18B"
    ambient_tint: "#D7AD98"
    shadow: "#676B7F"
    window_light_strength: 0.55
    lamp_strength: 0.35
    stars_strength: 0.00
  civil_twilight:
    sky_top: "#58658F"
    sky_horizon: "#C38FA1"
    ambient_tint: "#87809A"
    shadow: "#485064"
    window_light_strength: 0.80
    lamp_strength: 0.75
    stars_strength: 0.30
  night:
    sky_top: "#263B5B"
    sky_horizon: "#405A73"
    ambient_tint: "#4C6070"
    shadow: "#263642"
    window_light_strength: 1.00
    lamp_strength: 1.00
    stars_strength: 1.00

fx:
  reward_gold: "#F2C75C"
  verified_green: "#5FAF78"
  shield_cyan: "#70BED0"
  opponent_alert: "#D65E5E"
  combo_glow: "#FFDD83"

rules:
  - "Never use fx/opponent red to recolor a warm-front symbol."
  - "Never use decorative blue to alter cold-front geometry."
  - "World phase tokens may tint scenery; task/map semantic layers remain color-stable."
  - "Text may use non-pixel fonts when Cyrillic readability requires it."
  - "Hub location state must be readable without relying on color alone."
