world:
  id: '26063'
  wmo_index: '26063'
  region: Санкт-Петербург / Северо-Запад России / Берег Финского залива
  latitude_ref: 59.9386
  longitude_ref: 30.3141
  timezone: Europe/Moscow
  core_theme: continuity_of_observation
  core_thesis_ru: Главный герой этого мира — непрерывность наблюдений. 26063 — место, где погода постоянно меняется,
    а наблюдение за ней никогда не прерывается.
  cozy_formula_ru: До тебя здесь работали люди. Сейчас работаешь ты. После тебя придёт следующая смена.
  min_human_traces_per_scene: 3
  vibe_axes:
    professional: 8
    cozy: 8
    nostalgic: 6
    playful: 4
    monumental: 2
  fundamental_contrasts:
  - холодная балтийская погода <-> тёплый человеческий свет
  - огромная атмосфера <-> маленький рабочий стол
  - точная наука <-> живые человеческие привычки
  - старая классическая школа <-> современная техника
  - тишина северной природы <-> ритмичные щелчки работающего центра
  - профессиональная ответственность <-> спокойное душевное равновесие
  geography_rules:
    horizon: низкий северо-западный горизонт, акватория Финского залива, гранитная терраса
    vegetation:
    - сосна обыкновенная
    - берёза повислая
    - рябина
    - шиповник
    - сирень
    - мшистый газон
    sky_character: высокое многослойное небо, длинные сумерки, белые ночи летом, низкая слоистая облачность осенью
    forbidden_elements:
    - альпийские горные хребты
    - дворцовые колоннады и гигантские купола
    - повторяющиеся вывески с полным названием игры на каждом здании
    - военно-бункерная секретность или постапокалипсис
synoptic_schedule_utc:
- term_utc: 00:00
  local_msk: 03:00
  phase: night
  ritual: Ночной основной срок и ночной выпуск радиозонда; зелёная лампа в Оперативном зале
- term_utc: 03:00
  local_msk: 06:00
  phase: dawn
  ritual: Предрассветный срок; встреча рассвета на скамейке у сосен с горячей кружкой; обход Семёна
- term_utc: 06:00
  local_msk: 09:00
  phase: day
  ritual: Утренняя пересменка, разбор ночной карты у Веры Павловны, начало учебной смены
- term_utc: 09:00
  local_msk: '12:00'
  phase: day
  ritual: Полуденный срок, работа в Картографическом классе и Архиве, пятиминутка с чаем
- term_utc: '12:00'
  local_msk: '15:00'
  phase: day
  ritual: Главный дневной срок, выпуск дневного радиозонда, сверка приземной карты с АТ-850 и АТ-500
- term_utc: '15:00'
  local_msk: '18:00'
  phase: golden_hour
  ritual: Предвечерний срок, золотой час над заливом, учебные блицы и дуэли в Разборной
- term_utc: '18:00'
  local_msk: '21:00'
  phase: civil_twilight
  ritual: Вечерняя пересменка, зажигаются фонари и тёплые окна кампуса
- term_utc: '21:00'
  local_msk: 00:00
  phase: night
  ritual: Поздний вечерний срок, переход центра в тихий ночной режим, кот Паскаль уходит спать к телетайпу
