version: 1
status: accepted
runtime:
  phaser:
    version: 4.2.1
    role: browser-game-runtime
    repository: https://github.com/phaserjs/phaser
    package: phaser
asset_pipeline:
  sprite_tools:
    version: 0.1.0
    package: '@trebeljahr/sprite-tools'
    repository: https://github.com/trebeljahr/sprite-tools
  assetpack:
    version: 1.7.0
    package: '@assetpack/core'
    repository: https://github.com/pixijs/assetpack
editors:
  aseprite:
    version: 1.3.18.5
    role: primary-pixel-editor
    repository: https://github.com/aseprite/aseprite
  pixelorama:
    version: 1.2.3
    role: open-source-alternative
    repository: https://github.com/Orama-Interactive/Pixelorama
  tiled:
    version: 1.12.2
    role: canonical-world-scene-editor
    repository: https://github.com/mapeditor/tiled
  ldtk:
    version: 1.5.3
    role: optional-level-authoring-experiment
    repository: https://github.com/deepnight/ldtk
agent_tools:
  aseprite_ai_artist:
    repository: https://github.com/with-pebbly/aseprite-ai-artist
    policy: optional; pin commit before production use
  pixelkiln:
    repository: https://github.com/gfargo/pixelkiln
    policy: optional; provenance/review helper; pin commit before production use
policies:
  canonical_editable_sprite_format: .aseprite
  canonical_scene_format: Tiled JSON (.tmj/.tsj)
  generated_assets_hand_editing: forbidden
  runtime_filtering: nearest-neighbor
  dependency_upgrade: explicit ADR/review for Phaser major; manifest update for tools
