name: Проверка ассетов и графических контрактов
on:
  push:
    paths:
      - 'assets/source/**'
      - 'assets/manifests/**'
      - 'tools/assets/**'
      - 'assets/generated/hub/r01/**'
      - 'assets/generated/ui/hub-r01/**'
      - 'apps/web/public/hub/r01/**'
      - 'apps/web/public/assets/ui/hub-r01/**'
      - 'packages/world-engine/src/assets/hub/r01-approval.json'
  pull_request:
    paths:
      - 'assets/source/**'
      - 'assets/manifests/**'
      - 'tools/assets/**'
      - 'assets/generated/hub/r01/**'
      - 'assets/generated/ui/hub-r01/**'
      - 'apps/web/public/hub/r01/**'
      - 'apps/web/public/assets/ui/hub-r01/**'
      - 'packages/world-engine/src/assets/hub/r01-approval.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверка воспроизводимости графики R01
        run: |
          python -m pip install --disable-pip-version-check -r tools/assets/requirements-r01.txt
          python tools/assets/build_hub_r01.py --check
      - name: Проверка структуры манифестов
        run: |
          python tools/assets/check_asset_manifests.py
          node tools/assets/scripts/audit-hub-runtime.mjs
      - name: Проверка палитр проекта
        run: |
          python -c "
          from pathlib import Path
          palettes = list(Path('assets/source/palettes').glob('*.gpl'))
          print(f'Найдено палитр: {len(palettes)}')
          assert len(palettes) >= 2, 'Палитры не найдены'
          "
