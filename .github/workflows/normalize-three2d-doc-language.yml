name: Normalize Three.js architecture documentation language

on:
  workflow_dispatch:
  push:
    branches: [docs/three2d-renderer-contracts]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/three2d-renderer-contracts
      - name: Normalize explanatory prose without touching code or links
        shell: python
        run: |
          import re
          from pathlib import Path

          root = Path('.')
          excluded = {Path('docs/LANGUAGE_POLICY.md')}
          excluded_prefix = Path('docs/art-generation')

          replacements = [
              (re.compile(r'\bAcceptance criteria\b', re.I), 'Критерии приёмки'),
              (re.compile(r'\bDefinition of Ready\b', re.I), 'условия готовности к началу работы'),
              (re.compile(r'\bDefinition of Done\b', re.I), 'условия завершения'),
              (re.compile(r'\bgameplay\b', re.I), 'игровой процесс'),
              (re.compile(r'\bruntime\b', re.I), 'рабочий контур'),
              (re.compile(r'\bbacklog\b', re.I), 'перечень задач'),
              (re.compile(r'\broadmap\b', re.I), 'план реализации'),
              (re.compile(r'\bliving world\b', re.I), 'живой мир'),
              (re.compile(r'\bStatus\s*:', re.I), 'Статус:'),
              (re.compile(r'\bконтента\b', re.I), 'материала'),
              (re.compile(r'\bконтенте\b', re.I), 'материале'),
              (re.compile(r'\bконтентом\b', re.I), 'материалом'),
              (re.compile(r'\bконтенту\b', re.I), 'материалу'),
              (re.compile(r'\bконтент\b', re.I), 'материал'),
          ]
          protected = re.compile(r'(`[^`]*`|\[[^\]]*\]\([^)]+\))')

          def normalize_segment(segment: str) -> str:
              for pattern, replacement in replacements:
                  segment = pattern.sub(replacement, segment)
              return segment

          changed = []
          for path in sorted(Path('docs').rglob('*.md')):
              if path in excluded:
                  continue
              try:
                  path.relative_to(excluded_prefix)
                  continue
              except ValueError:
                  pass

              original = path.read_text(encoding='utf-8')
              out = []
              in_fence = False
              for line in original.splitlines(keepends=True):
                  stripped = line.lstrip()
                  if stripped.startswith('```') or stripped.startswith('~~~'):
                      in_fence = not in_fence
                      out.append(line)
                      continue
                  if in_fence:
                      out.append(line)
                      continue

                  parts = protected.split(line)
                  for i in range(0, len(parts), 2):
                      parts[i] = normalize_segment(parts[i])
                  out.append(''.join(parts))

              updated = ''.join(out)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          print('\n'.join(changed) if changed else '(none)')
      - name: Validate normalized documentation
        run: python tools/validate_repo.py
      - name: Commit normalization
        run: |
          if git diff --quiet -- docs tools/validate_repo.py; then
            echo 'No normalization changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs tools/validate_repo.py
          git commit -m 'docs: normalize 2.5D architecture language policy'
          git push origin HEAD:docs/three2d-renderer-contracts
