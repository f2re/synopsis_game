name: Качество документации и репозитория

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить структуру репозитория, JSON и локальные ссылки
        run: python tools/validate_repo.py

      - name: Проверить каноническую архитектуру первого рабочего среза
        run: python tools/validate_architecture.py
