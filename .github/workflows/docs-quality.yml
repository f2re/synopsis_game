name: Качество документации и репозитория

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить Python-зависимости проверок
        run: python -m pip install --disable-pip-version-check fonttools

      - name: Проверить структуру репозитория, JSON и локальные ссылки
        run: python tools/validate_repo.py

      - name: Проверить каноническую архитектуру первого рабочего среза
        run: python tools/validate_architecture.py

      - name: Проверить каноническое название и старые упоминания
        run: python tools/validate_brand.py

      - name: Проверить технические контракты графики
        run: |
          python tools/assets/check_asset_contract.py
          python tools/assets/check_generation_profiles.py

      - name: Проверить план харнесса KN01-AAA
        run: python tools/validate_harness_plan.py

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Включить Corepack
        run: corepack enable

      - name: Установить зависимости браузерного прототипа
        run: pnpm -C apps/web install --ignore-workspace --no-frozen-lockfile

      - name: Проверить TypeScript браузерного прототипа
        run: pnpm -C apps/web typecheck

      - name: Собрать браузерный прототип
        run: pnpm -C apps/web build
