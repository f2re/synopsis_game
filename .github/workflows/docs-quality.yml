name: Качество документации и репозитория

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить структуру репозитория, JSON и локальные ссылки
        run: python tools/validate_repo.py

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Включить Corepack
        run: corepack enable

      - name: Установить зависимости браузерного прототипа
        run: pnpm --filter @synopsis/web... install --no-frozen-lockfile

      - name: Проверить TypeScript
        run: pnpm typecheck

      - name: Собрать браузерный прототип
        run: pnpm build
