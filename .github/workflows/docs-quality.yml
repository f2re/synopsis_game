name: Качество документации и репозитория

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить структуру репозитория, JSON и локальные ссылки
        run: python tools/validate_repo.py

      - name: Проверить каноническую архитектуру первого рабочего среза
        run: python tools/validate_architecture.py

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Включить Corepack
        run: corepack enable

      - name: Установить зависимости сервера
        run: pnpm -C apps/server install --ignore-workspace --no-frozen-lockfile

      - name: Проверить серверный TypeScript
        run: pnpm -C apps/server typecheck

      - name: Запустить тесты identity
        run: pnpm -C apps/server test

      - name: Установить зависимости браузерного приложения
        run: pnpm -C apps/web install --ignore-workspace --no-frozen-lockfile

      - name: Проверить браузерный TypeScript
        run: pnpm -C apps/web typecheck

      - name: Собрать браузерное приложение
        run: pnpm -C apps/web build
