name: Сборка и интеграционные проверки
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - name: Подготовить Python-проверки
        run: python -m pip install --disable-pip-version-check fonttools pillow
      - name: Проверить Python-контракты
        run: |
          python tools/validate_repo.py
          python tools/validate_content_contracts.py
          python tools/validate_architecture.py
          python tools/validate_deployment.py
          python tools/test_deployment.py
          python tools/validate_brand.py
          python tools/assets/check_asset_contract.py
          python tools/assets/check_asset_manifests.py
          python tools/assets/check_generation_profiles.py
          python -m py_compile services/asset-generator/core/world_style_dataset.py services/asset-generator/scripts/build_style_dataset_v4.py services/asset-generator/scripts/train_world_style_v4.py
          python services/asset-generator/tests/test_world_style_dataset.py
          python scripts/validate_hub_lora_manifest.py
          python scripts/build_hub_generation_queue.py --check-only
          python scripts/validate_character_lora_manifest.py
          python scripts/build_character_generation_queue.py --check-only
          python scripts/validate_props_lora_manifest.py
          python scripts/build_props_generation_queue.py --check-only
          python -m py_compile scripts/validate_*_lora_manifest.py scripts/build_*_generation_queue.py
      - name: Проверить скрипты развёртывания
        run: |
          bash -n deploy/scripts/*.sh scripts/release/*.sh
          python -m py_compile deploy/scripts/*.py scripts/release/*.py tools/*.py tools/assets/*.py
      - name: Собрать приложение и проверить identity и первую смену
        run: |
          pnpm bootstrap
          pnpm typecheck
          pnpm world:test
          pnpm test:server
          pnpm build
      - name: Проверить Three.js Hub в headless Chromium
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          mkdir -p artifacts/hub-three2d
          pnpm -C apps/web preview --host 127.0.0.1 --port 4173 >artifacts/hub-three2d/preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          base_url='http://127.0.0.1:4173/?hubRenderer=three2d&hubReview=1'
          for style in raw palette dither edges; do
            "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --use-angle=swiftshader \
              --enable-unsafe-swiftshader \
              --ignore-gpu-blocklist \
              --window-size=640,360 \
              --virtual-time-budget=4000 \
              --screenshot="artifacts/hub-three2d/hub-three2d-${style}.png" \
              "${base_url}&hubStyle=${style}"
            test -s "artifacts/hub-three2d/hub-three2d-${style}.png"
          done
          debug_url="${base_url}&hubGeometryDebug=1&hubStyle=edges"
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --ignore-gpu-blocklist \
            --window-size=640,360 \
            --virtual-time-budget=4000 \
            --screenshot=artifacts/hub-three2d/hub-three2d-geometry-debug.png \
            "$debug_url"
          test -s artifacts/hub-three2d/hub-three2d-geometry-debug.png
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --ignore-gpu-blocklist \
            --virtual-time-budget=4000 \
            --dump-dom \
            "${base_url}&hubStyle=edges" >artifacts/hub-three2d/dom.html
          grep -q 'data-renderer="three2d"' artifacts/hub-three2d/dom.html
      - name: Сохранить snapshot Three.js Hub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-three2d-style-lab
          path: artifacts/hub-three2d
          if-no-files-found: warn
      - name: Проверить production-сервер
        run: |
          SYNOPSIS_IDENTITY_STORE=/tmp/synopsis-identity-ci.json API_BIND=127.0.0.1 API_PORT=4174 node apps/server/dist/index.js >/tmp/synopsis-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4174/ready && break || sleep 0.5; done
          curl -fsS http://127.0.0.1:4174/health
          curl -fsS http://127.0.0.1:4174/api/identity/groups
      - name: Собрать и проверить кандидат Linux-релиза
        env:
          NODE_VERSION: '22.23.4'
        run: |
          bash scripts/release/build-release.sh 0.0.0-ci
          bash scripts/release/validate-release.sh dist-release/synopsis-game-0.0.0-ci-linux-x64.tar.gz
      - name: Проверить кандидат на Astra Linux 1.7
        run: bash scripts/release/test-astra17.sh dist-release/synopsis-game-0.0.0-ci-linux-x64.tar.gz
