name: Сборка и интеграционные проверки
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - name: Нормализовать lockfile интеграционной ветки
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/integration-release/deployment-infrastructure'
        run: |
          rm -f apps/web/pnpm-lock.yaml
          pnpm -C apps/web install --ignore-workspace --lockfile-only --no-frozen-lockfile
          if ! git diff --quiet -- apps/web/pnpm-lock.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/web/pnpm-lock.yaml
            git commit -m 'build: normalize reproducible web lockfile'
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi
      - name: Проверить Python-валидаторы
        run: |
          python tools/validate_repo.py
          python tools/validate_architecture.py
          python tools/validate_deployment.py
          python tools/test_deployment.py
      - name: Проверить скрипты развёртывания
        run: |
          bash -n deploy/scripts/*.sh scripts/release/*.sh
          python -m py_compile deploy/scripts/*.py scripts/release/*.py tools/*.py
      - name: Собрать клиент
        run: |
          pnpm bootstrap:web
          pnpm typecheck
          pnpm build
      - name: Проверить сервер
        run: |
          node apps/server/server.mjs >/tmp/synopsis-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4174/ready && break || sleep 0.5; done
          curl -fsS http://127.0.0.1:4174/health
      - name: Собрать и проверить кандидат Linux-релиза
        env:
          NODE_VERSION: '22.23.4'
        run: |
          bash scripts/release/build-release.sh 0.0.0-ci
          bash scripts/release/validate-release.sh dist-release/synopsis-game-0.0.0-ci-linux-x64.tar.gz
      - name: Проверить кандидат на Astra Linux 1.7
        run: bash scripts/release/test-astra17.sh dist-release/synopsis-game-0.0.0-ci-linux-x64.tar.gz
