name: Одноразовая миграция бренда 26063

on:
  push:
    branches:
      - agent/orchestrator/brand-26063

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Получить ветку
        uses: actions/checkout@v4
        with:
          ref: agent/orchestrator/brand-26063
          fetch-depth: 0

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Применить миграцию
        run: python tools/migrate_brand_26063.py

      - name: Проверить результат
        run: python tools/validate_brand.py

      - name: Зафиксировать изменения
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Изменений нет.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CONTRIBUTING.md AGENTS.md agents docs apps config design
          git commit -m 'docs: завершить переименование в 26063'
          git push origin HEAD:agent/orchestrator/brand-26063
