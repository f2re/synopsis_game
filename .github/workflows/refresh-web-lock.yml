name: Временная фиксация web lockfile
on:
  push:
    branches:
      - 'agent/integration-release/deployment-infrastructure'
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'build: regenerate canonical web lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integration-release/deployment-infrastructure
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - name: Пересоздать lockfile
        run: |
          rm -f apps/web/pnpm-lock.yaml
          pnpm -C apps/web install --ignore-workspace --no-frozen-lockfile
      - name: Зафиксировать lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: regenerate canonical web lockfile'
          git push origin HEAD:agent/integration-release/deployment-infrastructure
