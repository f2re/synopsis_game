name: Add Hub projection guard

on:
  push:
    branches: [feat/hub-three2d-poc]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hub-three2d-poc
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - name: Install web dependencies
        run: pnpm -C apps/web install --ignore-workspace --frozen-lockfile
      - name: Add startup Geometry Lock assertion
        shell: python
        run: |
          from pathlib import Path

          path = Path('packages/world-engine/src/renderer/three/ThreeHubRenderer.ts')
          text = path.read_text(encoding='utf-8')
          anchor = "    this.scene.add(this.worldRoot, this.weatherGroup, this.debugGroup, this.ambientLight, this.sunLight);\n    this.sunLight.position.set(-240, 520, 280);\n\n    this.createVerticalSlice();"
          replacement = """    this.scene.add(this.worldRoot, this.weatherGroup, this.debugGroup, this.ambientLight, this.sunLight);
    this.sunLight.position.set(-240, 520, 280);

    this.projection.assertRoundTrip([
      { id: 'canvas.top-left', x: 0, y: 0 },
      { id: 'canvas.center', x: HUB_LOGICAL_WIDTH / 2, y: HUB_LOGICAL_HEIGHT / 2 },
      { id: 'canvas.bottom-right', x: HUB_LOGICAL_WIDTH, y: HUB_LOGICAL_HEIGHT },
      ...HUB_WORLD_DEFINITION_V1.buildings.map((building) => ({
        id: `${building.id}.entrance`,
        x: building.entrance.x,
        y: building.entrance.y,
      })),
    ]);

    this.createVerticalSlice();"""
          if anchor not in text:
              raise SystemExit('ThreeHubRenderer insertion anchor not found')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
      - name: Verify typecheck and build
        run: |
          pnpm -C apps/web typecheck
          pnpm -C apps/web build
      - name: Commit verified guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/world-engine/src/renderer/three/ThreeHubRenderer.ts
          git commit -m 'test(world): assert Hub Geometry Lock projection at startup'
          git push origin HEAD:feat/hub-three2d-poc
