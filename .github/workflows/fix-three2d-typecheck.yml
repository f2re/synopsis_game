name: Repair Three.js POC typecheck blockers

on:
  push:
    branches: [feat/hub-three2d-poc]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hub-three2d-poc
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - name: Patch POC type surface and state union
        run: |
          python - <<'PY'
          from pathlib import Path

          refs = {
              Path('packages/world-engine/src/renderer/three/HubProjection.ts'): '/// <reference path="./three-poc.d.ts" />\n',
              Path('packages/world-engine/src/renderer/three/ThreeHubRenderer.ts'): '/// <reference path="./three-poc.d.ts" />\n',
              Path('packages/world-engine/src/renderer/three/post/PixelPostPipeline.ts'): '/// <reference path="../three-poc.d.ts" />\n',
          }
          for path, reference in refs.items():
              text = path.read_text(encoding='utf-8')
              if not text.startswith(reference):
                  path.write_text(reference + text, encoding='utf-8')

          path = Path('packages/world-engine/src/renderer/three/ThreeHubRenderer.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace("        case 'completed':", "        case 'just_unlocked':")
          text = text.replace('    this.scene.traverse((object) => {', '    this.scene.traverse((object: Object3D) => {')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify web TypeScript consumer
        run: |
          pnpm -C apps/web install --ignore-workspace --frozen-lockfile
          pnpm -C apps/web typecheck
      - name: Commit verified fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/world-engine/src/renderer/three
          git commit -m 'fix(world): make Three.js POC type-safe for web consumer'
          git push origin HEAD:feat/hub-three2d-poc
