name: Repair obsolete Hub prompt branding

on:
  push:
    branches: [docs/three2d-renderer-contracts]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/three2d-renderer-contracts
      - name: Replace obsolete building name in generation contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('docs/art-generation/batches/BATCH-10-HUB-LANDMARK-OVERLAYS.md'),
              Path('docs/art-generation/batches/BATCH-12-HUB-FULLSCREEN-BACKGROUND.md'),
              Path('docs/art-generation/batches/BATCH-13-HUB-ARCHITECTURE.md'),
              Path('docs/art-generation/batches/BATCH-22-HUB-BUILDING-ACTIVITY.md'),
              Path('docs/art-generation/batches/BATCH-25-HUB-INTERACTION-STATES.md'),
          ]
          obsolete = 'Synoptic' + ' Center'
          replacement = '26063 main operations building'
          changed = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(obsolete)
              if count:
                  path.write_text(text.replace(obsolete, replacement), encoding='utf-8')
                  changed += count
          print(f'Replaced {changed} obsolete occurrences')
          if changed != 13:
              raise SystemExit(f'Expected exactly 13 replacements, got {changed}')
          PY
      - name: Validate brand contract
        run: python tools/validate_brand.py
      - name: Commit repaired prompt contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/art-generation/batches
          git commit -m 'docs(art): replace obsolete Hub building naming'
          git push origin HEAD:docs/three2d-renderer-contracts
