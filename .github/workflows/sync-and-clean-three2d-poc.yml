name: Sync and harden Three.js POC

on:
  push:
    branches: [feat/hub-three2d-poc]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hub-three2d-poc
          fetch-depth: 0
      - name: Merge architecture base and apply POC cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin docs/three2d-renderer-contracts
          git merge --no-edit origin/docs/three2d-renderer-contracts
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/world-engine/src/renderer/three/ThreeHubRenderer.ts')
          text = path.read_text(encoding='utf-8')
          needle = "    this.scene.background = new Color(colorForPhase(phase));\n\n    switch (phase) {"
          replacement = "    this.scene.background = new Color(colorForPhase(phase));\n    this.sunLight.color.setHex(0xffe7c0);\n\n    switch (phase) {"
          if needle not in text:
              raise SystemExit('Expected setDayPhase anchor not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          rm -f packages/world-engine/src/renderer/three/.gitkeep
          git add -A
          git commit -m 'fix(world): harden Three.js day-phase state reset'
          git push origin HEAD:feat/hub-three2d-poc
