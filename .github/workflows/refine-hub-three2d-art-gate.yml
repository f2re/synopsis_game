name: Refine Three Hub art gate

on:
  push:
    branches: [feat/hub-three2d-poc]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hub-three2d-poc
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - name: Refine materials, state signalling and default dithering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/world-engine/src/renderer/three/ThreeHubRenderer.ts')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "roof: WORLD_PALETTE.stoneConcrete1,\n        widthRatio: 0.76,": "roof: WORLD_PALETTE.skyNight4,\n        widthRatio: 0.76,",
              "roof: WORLD_PALETTE.birchAndSnow3,\n        widthRatio: 0.34,": "roof: WORLD_PALETTE.birchAndSnow2,\n        widthRatio: 0.34,",
              "roof: WORLD_PALETTE.ochreTerracotta0,\n        widthRatio: 0.67,": "roof: WORLD_PALETTE.ochreTerracotta1,\n        widthRatio: 0.67,",
              "roof: WORLD_PALETTE.ochreTerracotta0,\n        widthRatio: 0.66,": "roof: WORLD_PALETTE.ochreTerracotta1,\n        widthRatio: 0.66,",
              "roof: WORLD_PALETTE.stoneConcrete1,\n        widthRatio: 0.72,": "roof: WORLD_PALETTE.stoneConcrete3,\n        widthRatio: 0.72,",
              "roof: WORLD_PALETTE.stoneConcrete1,\n        widthRatio: 0.54,": "roof: WORLD_PALETTE.stoneConcrete3,\n        widthRatio: 0.54,",
              "roof: WORLD_PALETTE.ochreTerracotta0,\n        widthRatio: 0.61,": "roof: WORLD_PALETTE.ochreTerracotta1,\n        widthRatio: 0.61,",
              "private readonly waterMaterial: MeshToonMaterial;": "private readonly waterMaterial: MeshBasicMaterial;",
              "dither: query.get('pixelDither') !== '0',": "dither: query.get('pixelDither') === '1',",
              "this.waterMaterial = this.toon(WORLD_PALETTE.waterGulf2);": "this.waterMaterial = new MeshBasicMaterial({ color: WORLD_PALETTE.waterGulf2 });",
              "this.ambientLight.intensity = 0.74;\n        this.sunLight.intensity = 0.36;": "this.ambientLight.intensity = 0.9;\n        this.sunLight.intensity = 0.48;",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected renderer fragment not found: {old!r}')
              text = text.replace(old, new, 1)

          old_switch = """    for (const [id, state] of Object.entries(states)) {
      const material = this.buildingMaterials.get(id);
      if (!material) continue;
      switch (state) {
        case 'locked':
          material.color.setHex(WORLD_PALETTE.stoneConcrete1);
          break;
        case 'active':
          material.color.setHex(WORLD_PALETTE.ochreTerracotta3);
          break;
        case 'just_unlocked':
          material.color.setHex(WORLD_PALETTE.foliagePine4);
          break;
        case 'available':
        default:
          material.color.setHex(styleForStructure(id).wall);
          break;
      }
    }"""
          new_switch = """    for (const id of Object.keys(states)) {
      const material = this.buildingMaterials.get(id);
      if (!material) continue;
      // Progression is semantic state, not an alternate facade texture/material.
      // Keep the canonical architecture readable; a dedicated accent/emissive
      // channel will communicate locked/active/unlocked without repainting it.
      material.color.setHex(styleForStructure(id).wall);
    }"""
          if old_switch not in text:
              raise SystemExit('Building-state switch fragment not found')
          text = text.replace(old_switch, new_switch, 1)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/hub-visual-smoke.yml')
          smoke = workflow.read_text(encoding='utf-8')
          smoke = smoke.replace(
              'capture three-dither-off "${base}?hubRenderer=three2d&hubPhase=day&hubSeason=summer&hubWeather=clear&pixelDither=0"',
              'capture three-dither-on "${base}?hubRenderer=three2d&hubPhase=day&hubSeason=summer&hubWeather=clear&pixelDither=1"',
          )
          smoke = smoke.replace("'three-dither-off',", "'three-dither-on',")
          smoke = smoke.replace("('three-day-clear', 'three-dither-off'),", "('three-day-clear', 'three-dither-on'),")
          workflow.write_text(smoke, encoding='utf-8')
          PY
      - name: Verify web consumer
        run: |
          pnpm -C apps/web install --ignore-workspace --frozen-lockfile
          pnpm -C apps/web typecheck
          pnpm -C apps/web build
      - name: Commit verified refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/world-engine/src/renderer/three/ThreeHubRenderer.ts .github/workflows/hub-visual-smoke.yml
          git commit -m 'fix(world): preserve Hub materials across progression states'
          git push origin HEAD:feat/hub-three2d-poc
