name: Sync Three.js POC with architecture base

on:
  push:
    branches: [feat/hub-three2d-poc]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hub-three2d-poc
          fetch-depth: 0
      - name: Merge current architecture base
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin docs/three2d-renderer-contracts
          git merge --no-edit origin/docs/three2d-renderer-contracts
          git push origin HEAD:feat/hub-three2d-poc
