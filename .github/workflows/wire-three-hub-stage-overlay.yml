name: Wire Three Hub stage overlay

on:
  push:
    branches:
      - feat/hub-three2d-poc

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hub-three2d-poc
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - name: Patch HubScene
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/world-engine/src/scenes/hub/HubScene.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "import { HUB_BUILDING_BY_ID } from '../../world/hub/HubWorldDefinition';",
              "import { HUB_BUILDING_BY_ID, HUB_WORLD_DEFINITION_V1 } from '../../world/hub/HubWorldDefinition';",
          )
          anchor = """    this.threeRenderer = new ThreeHubRenderer(this);
    this.dossierLayer = new HubDossierLayer("""
          replacement = """    this.threeRenderer = new ThreeHubRenderer(this);
    this.stageLayer = new HubStageLayer(this, HUB_WORLD_DEFINITION_V1.buildings);
    this.dossierLayer = new HubDossierLayer("""
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif 'new HubStageLayer(this, HUB_WORLD_DEFINITION_V1.buildings)' not in text:
              raise SystemExit('Three Hub stage-layer insertion anchor not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify web typecheck and build
        run: |
          pnpm -C apps/web install --ignore-workspace --frozen-lockfile
          pnpm -C apps/web typecheck
          pnpm -C apps/web build
      - name: Commit patch if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/world-engine/src/scenes/hub/HubScene.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(world): render stage progression over Three Hub'
          git push origin HEAD:feat/hub-three2d-poc
