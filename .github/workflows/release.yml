name: Выпуск релиза
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без v, например 0.1.0'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22.23.4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - name: Определить версию
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${{ inputs.version }}"; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Полная проверка
        run: |
          python tools/validate_repo.py
          python tools/validate_architecture.py
          python tools/validate_deployment.py
          bash -n deploy/scripts/*.sh scripts/release/*.sh
          python -m py_compile deploy/scripts/*.py scripts/release/*.py
      - name: Собрать релизный пакет
        run: bash scripts/release/build-release.sh "${{ steps.v.outputs.version }}"
      - name: Проверить релизный пакет
        run: bash scripts/release/validate-release.sh "dist-release/synopsis-game-${{ steps.v.outputs.version }}-linux-x64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: synopsis-game-${{ steps.v.outputs.version }}-linux-x64
          path: |
            dist-release/synopsis-game-${{ steps.v.outputs.version }}-linux-x64.tar.gz
            dist-release/synopsis-game-${{ steps.v.outputs.version }}-linux-x64.tar.gz.sha256
      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          TAG="v$VERSION"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then git tag "$TAG" "$GITHUB_SHA"; git push origin "$TAG"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Synopsis Game $TAG" --generate-notes
          gh release upload "$TAG" "dist-release/synopsis-game-$VERSION-linux-x64.tar.gz" "dist-release/synopsis-game-$VERSION-linux-x64.tar.gz.sha256" --clobber
