name: Выпуск релиза
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без v, например 0.1.0'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22.23.4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - name: Определить версию и необходимость выпуска
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISH=true
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$PACKAGE_VERSION"
            TAG="v$VERSION"
            git fetch --tags --force
            if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then PUBLISH=false; fi
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION" == "$PACKAGE_VERSION" ]] || { echo "Версия выпуска $VERSION не совпадает с package.json: $PACKAGE_VERSION" >&2; exit 2; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Полная проверка
        if: steps.v.outputs.publish == 'true'
        run: |
          python tools/validate_repo.py
          python tools/validate_architecture.py
          python tools/validate_deployment.py
          python tools/test_deployment.py
          bash -n deploy/scripts/*.sh scripts/release/*.sh
          python -m py_compile deploy/scripts/*.py scripts/release/*.py tools/*.py
      - name: Собрать релизный пакет
        if: steps.v.outputs.publish == 'true'
        run: bash scripts/release/build-release.sh "${{ steps.v.outputs.version }}"
      - name: Проверить релизный пакет
        if: steps.v.outputs.publish == 'true'
        run: bash scripts/release/validate-release.sh "dist-release/synopsis-game-${{ steps.v.outputs.version }}-linux-x64.tar.gz"
      - name: Проверить релиз на Astra Linux 1.7
        if: steps.v.outputs.publish == 'true'
        run: bash scripts/release/test-astra17.sh "dist-release/synopsis-game-${{ steps.v.outputs.version }}-linux-x64.tar.gz"
      - uses: actions/upload-artifact@v4
        if: steps.v.outputs.publish == 'true'
        with:
          name: synopsis-game-${{ steps.v.outputs.version }}-linux-x64
          path: |
            dist-release/synopsis-game-${{ steps.v.outputs.version }}-linux-x64.tar.gz
            dist-release/synopsis-game-${{ steps.v.outputs.version }}-linux-x64.tar.gz.sha256
      - name: Создать GitHub Release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          TAG="v$VERSION"
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then git tag "$TAG" "$GITHUB_SHA"; git push origin "$TAG"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Synopsis Game $TAG" --generate-notes
          gh release upload "$TAG" "dist-release/synopsis-game-$VERSION-linux-x64.tar.gz" "dist-release/synopsis-game-$VERSION-linux-x64.tar.gz.sha256" --clobber
