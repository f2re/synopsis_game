name: Apply Three Hub instancing patch

on:
  push:
    branches:
      - feat/hub-three2d-poc
    paths:
      - 'tools/patch_three_instancing.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hub-three2d-poc
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - name: Apply patch
        run: python tools/patch_three_instancing.py
      - name: Verify web consumer
        run: |
          pnpm -C apps/web install --ignore-workspace --frozen-lockfile
          pnpm -C apps/web typecheck
          pnpm -C apps/web build
      - name: Commit verified renderer batching
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/world-engine/src/renderer/three/ThreeHubRenderer.ts
          git commit -m 'perf(world): instance repeated Hub geometry'
          git push origin HEAD:feat/hub-three2d-poc
