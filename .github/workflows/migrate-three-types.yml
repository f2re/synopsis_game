name: Migrate Three.js typings

on:
  push:
    branches:
      - feat/hub-three2d-poc
    paths:
      - 'packages/world-engine/package.json'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hub-three2d-poc
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.8'
      - name: Regenerate lockfiles
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm -C apps/web install --ignore-workspace --lockfile-only --no-frozen-lockfile
      - name: Remove temporary Three.js declarations
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('packages/world-engine/src/renderer/three/HubProjection.ts'),
              Path('packages/world-engine/src/renderer/three/ThreeHubRenderer.ts'),
              Path('packages/world-engine/src/renderer/three/post/PixelPostPipeline.ts'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              if lines and lines[0].startswith('/// <reference path='):
                  path.write_text('\n'.join(lines[1:]) + '\n', encoding='utf-8')
          PY
          rm packages/world-engine/src/renderer/three/three-poc.d.ts
      - name: Verify source package and web consumer
        run: |
          pnpm -C apps/web install --ignore-workspace --frozen-lockfile
          pnpm -C packages/world-engine typecheck
          pnpm -C apps/web typecheck
          pnpm -C apps/web build
      - name: Commit verified migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml apps/web/pnpm-lock.yaml packages/world-engine/src/renderer/three
          git commit -m 'chore(world): replace Three.js POC shim with maintained typings'
          git push origin HEAD:feat/hub-three2d-poc
