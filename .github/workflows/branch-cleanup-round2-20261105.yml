name: Очистка четырёх устаревших веток — проверка #119
on:
  push:
    branches: [main]
    paths:
      - 'tools/maintenance/branch_cleanup_round2_20261105.json'
      - 'tools/maintenance/prune_superseded_20261105.py'
      - '.github/workflows/branch-cleanup-round2-20261105.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synopsis-game-branch-cleanup-round2
  cancel-in-progress: false

jobs:
  prune:
    if: github.repository == 'f2re/synopsis_game' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить SHA, открытые PR, наличие перенесённого кода и режим очистки
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/maintenance/prune_superseded_20261105.py
      - name: Сохранить протокол
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-round2-20261105
          path: branch_cleanup_round2_result.json
          if-no-files-found: warn
