name: Content task / scenario
description: Новое учебное задание, пакет, сценарий или архивный кейс
title: "content: "
labels: []
body:
  - type: input
    id: module
    attributes:
      label: Модуль / topic
      placeholder: "KN-01, station_plot, frontology, AT-850..."
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Method profile
      placeholder: "RUS_CLASSIC_TRAINING_V1"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Источник
      description: Source ID, документ, издание, раздел/страница.
    validations:
      required: true
  - type: dropdown
    id: origin
    attributes:
      label: Происхождение данных
      options:
        - authored_training
        - synthetic_drill
        - real_archive
        - current_operational
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Задание / сценарий
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: Эталон и объяснение
      description: Не публикуйте чувствительные production answers, если issue уже относится к закрытому экзаменационному набору.
    validations:
      required: true
  - type: textarea
    id: ambiguity
    attributes:
      label: Допустимые альтернативы и неоднозначности
  - type: textarea
    id: errors
    attributes:
      label: Reason codes / типичные ошибки
  - type: checkboxes
    id: review
    attributes:
      label: Проверка
      options:
        - label: Источник конкретизирован до редакции/раздела.
        - label: Если данные реальные, provenance и право использования известны.
        - label: Синтетический материал не выдан за реальный.
        - label: Задание не зависит от неявного кафедрального правила.
