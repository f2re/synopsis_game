<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>26063 · Проверка узкого экрана</title>
    <style>
      @font-face { font-family: 'PixCyrillic'; src: url('/fonts/PixCyrillic.woff2') format('woff2'); font-display: swap; }
      * { box-sizing: border-box; }
      body { margin: 0; color: #eef4e4; background: #060e1b; font: 16px/1.35 'PixCyrillic', monospace; }
      header { min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 2px 12px; border-bottom: 1px solid #455d76; }
      h1 { margin: 0; font-size: 16px; font-weight: normal; color: #ffdd83; }
      button { min-height: 38px; padding: 5px 12px; border: 1px solid #7895a7; color: #eef4e4; background: #172a40; font: inherit; cursor: pointer; }
      button[aria-pressed='true'] { color: #ffdd83; border-color: #ffdd83; }
      button:focus-visible { outline: 2px solid #ffdd83; outline-offset: 2px; }
      main { display: flex; justify-content: center; padding: 6px; overflow: auto; }
      iframe { display: block; flex: 0 0 auto; box-sizing: content-box; width: 390px; height: 844px; border: 2px solid #7895a7; background: #101d30; }
    </style>
  </head>
  <body>
    <header>
      <h1>Тестовый стенд · узкий экран</h1>
      <button type="button" data-width="390" aria-pressed="true">390 px</button>
      <button type="button" data-width="768" aria-pressed="false">768 px</button>
      <span id="viewport-label" aria-live="polite">390 × 844</span>
    </header>
    <main>
      <iframe id="review-frame" title="Тестовый стенд внешности: область 390 на 844 пикселя" src="./modular-player.html" width="390" height="844"></iframe>
    </main>
    <script>
      const frame = document.getElementById('review-frame');
      const label = document.getElementById('viewport-label');
      for (const button of document.querySelectorAll('button[data-width]')) {
        button.addEventListener('click', () => {
          const width = button.dataset.width;
          frame.style.width = `${width}px`;
          frame.title = `Тестовый стенд внешности: область ${width} на 844 пикселя`;
          label.textContent = `${width} × 844`;
          for (const choice of document.querySelectorAll('button[data-width]')) choice.setAttribute('aria-pressed', String(choice === button));
        });
      }
    </script>
  </body>
</html>
