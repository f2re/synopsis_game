<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>26063 · Тестовый стенд блица</title>
    <style>
      .blitz-review-banner { position: relative; z-index: 2000; display: grid; gap: 10px; padding: 14px 20px; background: #101d30; border-bottom: 3px solid #f2c75c; color: #eef4e4; font: 16px/1.5 var(--font-pixel-ui, monospace); }
      .blitz-review-banner strong { color: #ffdd83; font-size: 32px; font-weight: normal; }
      .blitz-review-banner nav { display: flex; gap: 8px; flex-wrap: wrap; }
      .blitz-review-banner button { min-height: 44px; padding: 8px 12px; background: #1b374c; border: 1px solid #7895a7; color: #eef4e4; font: inherit; cursor: pointer; }
      .blitz-review-banner button[aria-pressed=true] { border-color: #ffdd83; }
      .blitz-review-banner button:focus-visible { outline: 3px solid #ffdd83; outline-offset: 2px; }
    </style>
  </head>
  <body><div id="review-root"></div><script type="module" src="./blitz-practice.tsx"></script></body>
</html>
